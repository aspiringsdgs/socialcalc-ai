name: Publish

# Publishes the socialcalc/ package when a GitHub Release is published.
#   - GitHub Packages: @aspiringsdgs/socialcalc-ai (uses the built-in GITHUB_TOKEN)
#   - npm:             socialcalc-ai               (needs the NPM_TOKEN repository secret)
# Run it by hand from the Actions tab to publish to one registry only.
#
# The MCP server in Socialcalc-MCP/ is NOT published from here. It is released
# from https://github.com/aspiringsdgs/socialcalc-mcp.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      registry:
        description: Registry to publish to
        type: choice
        options:
          - github
          - npm
          - both
        default: github

permissions:
  contents: read

jobs:
  github-packages:
    if: github.event_name == 'release' || inputs.registry == 'github' || inputs.registry == 'both'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: socialcalc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://npm.pkg.github.com
          scope: "@aspiringsdgs"

      - name: Check release tag matches package.json version
        if: github.event_name == 'release'
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "${{ github.event.release.tag_name }}" ]; then
            echo "::error::Release tag ${{ github.event.release.tag_name }} does not match socialcalc/package.json version ($expected)"
            exit 1
          fi

      # `npm publish` runs the package's prepublishOnly script, which runs the
      # library tests and builds dist/ (the files that ship). Both need the
      # repository's dev dependencies (vitest, jsdom, esbuild) from the root.
      - name: Install dependencies
        working-directory: .
        run: npm ci

      # GitHub Packages only accepts packages scoped to the owner, so the scope is
      # added here instead of changing the name that is published to npm.
      - name: Publish to GitHub Packages
        run: |
          npm pkg set name=@aspiringsdgs/socialcalc-ai
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm:
    if: github.event_name == 'release' || inputs.registry == 'npm' || inputs.registry == 'both'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: socialcalc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - name: Require NPM_TOKEN
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::The NPM_TOKEN repository secret is not set"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check release tag matches package.json version
        if: github.event_name == 'release'
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "${{ github.event.release.tag_name }}" ]; then
            echo "::error::Release tag ${{ github.event.release.tag_name }} does not match socialcalc/package.json version ($expected)"
            exit 1
          fi

      # prepublishOnly runs the library tests and builds dist/; it needs the root dev dependencies
      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
